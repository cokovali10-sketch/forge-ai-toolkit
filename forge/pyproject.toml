[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-core"
version = "0.13.0"
description = "FORGE: universal dev-automation toolkit for AI agents - verification conveyor, code-quality advisor with safe auto-fix, self-healing loop, kit (map/test/ci/secrets/deps/doctor) and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cokovali10-sketch" }]
dependencies = []
keywords = ["ai-agents", "mcp", "code-quality", "refactoring", "static-analysis",
            "developer-tools", "automation", "testing", "security", "minecraft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.scripts]
forge = "forge.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/cokovali10-sketch/forge-ai-toolkit"
Repository = "https://github.com/cokovali10-sketch/forge-ai-toolkit"
Issues = "https://github.com/cokovali10-sketch/forge-ai-toolkit/issues"
Changelog = "https://github.com/cokovali10-sketch/forge-ai-toolkit/blob/main/forge/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
